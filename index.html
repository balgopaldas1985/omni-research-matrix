<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OMNI-RESEARCH MATRIX & EXAM ENGINE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #030712;
            color: #f3f4f6;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        header {
            background: #0f172a;
            border-bottom: 1px solid #1e293b;
            padding: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            font-size: 1rem;
            font-weight: 800;
            color: #38bdf8;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .search-box {
            display: flex;
            gap: 8px;
        }

        .search-input {
            flex: 1;
            background: #1e293b;
            border: 1px solid #334155;
            color: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        .search-input:focus {
            border-color: #38bdf8;
        }

        .search-btn {
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .nav-tabs {
            display: flex;
            background: #0b0f19;
            border-bottom: 1px solid #1e293b;
            padding: 8px 16px;
            gap: 8px;
        }

        .tab-btn {
            flex: 1;
            background: #1e293b;
            border: none;
            color: #94a3b8;
            padding: 10px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .tab-btn.active {
            background: #0284c7;
            color: #fff;
        }

        main {
            padding: 16px;
            max-width: 900px;
            margin: 0 auto;
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        /* --- NOTES & LESSON SECTION --- */
        .card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 16px;
        }

        .card h2 {
            font-size: 1.1rem;
            color: #38bdf8;
            margin-bottom: 10px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 6px;
        }

        .card p, .card ul {
            font-size: 0.88rem;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .card ul {
            padding-left: 20px;
        }

        .pdf-download-btn {
            display: inline-block;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            color: #34d399;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            text-decoration: none;
            margin-top: 8px;
            cursor: pointer;
        }

        /* --- VIDEO MATRIX GRID --- */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .video-card {
            background: #1e293b;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #334155;
        }

        .video-card iframe {
            width: 100%;
            height: 150px;
            border: none;
        }

        .video-title {
            padding: 8px 12px;
            font-size: 0.78rem;
            color: #e2e8f0;
            font-weight: 600;
        }

        /* --- 100 QUESTION EXAM STYLING --- */
        .exam-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .q-item {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 14px;
        }

        .q-num {
            font-size: 0.75rem;
            color: #38bdf8;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .q-text {
            font-size: 0.9rem;
            color: #f8fafc;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .opt-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .opt-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.82rem;
            text-align: left;
            cursor: pointer;
        }

        .opt-btn.correct {
            background: rgba(16, 185, 129, 0.25) !important;
            border-color: #10b981 !important;
            color: #34d399 !important;
        }

        .opt-btn.wrong {
            background: rgba(244, 63, 94, 0.25) !important;
            border-color: #f43f5e !important;
            color: #fda4af !important;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">OMNI-RESEARCH MATRIX</div>
        <div class="search-box">
            <input type="text" id="topicInput" class="search-input" placeholder="Enter topic (e.g. Kung Fu, Quantum, Music Octaves, Physics)...">
            <button class="search-btn" onclick="executeSearch()">GENERATE</button>
        </div>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('notes')">📚 LESSON NOTES & VIDEOS</button>
        <button class="tab-btn" onclick="switchTab('exam')">⚡ 100-QUESTION EXAM</button>
    </div>

    <main>
        <!-- TAB 1: NOTES & VIDEO TUTORIALS -->
        <section id="notes-view" class="view-section active">
            <div class="card" id="lessonCard">
                <h2 id="lessonTitle">Quantum Mechanics & Wave-Particle Duality</h2>
                <div id="lessonText">
                    <p>Enter any topic in the search bar above to generate custom multi-disciplinary notes, mathematical models, biomechanical rules, and structural guides.</p>
                </div>
                <button class="pdf-download-btn" onclick="downloadPDFNotes()">📄 DOWNLOAD FULL LESSON PDF (PRINTABLE)</button>
            </div>

            <div class="card">
                <h2>🎥 CURATED LEARNING VIDEOS (MODULE LECTURES)</h2>
                <div class="video-grid" id="videoContainer">
                    <!-- Video Embeds populate dynamically -->
                </div>
            </div>
        </section>

        <!-- TAB 2: 100 QUESTION EXAM -->
        <section id="exam-view" class="view-section">
            <div class="exam-header">
                <span id="examTopicTag">TOPIC: GENERAL SCIENCE</span>
                <span style="color:#10b981;">SCORE: <span id="scoreVal">0</span> / 100</span>
            </div>
            <div id="examContainer">
                <!-- 100 Questions dynamically rendered here -->
            </div>
        </section>
    </main>

    <script>
        let currentTopic = "Quantum Mechanics";
        let score = 0;

        // Embedded Educational Embed IDs
        const videoLibrary = [
            { title: "Module 1: Fundamental Principles & Core Axioms", id: "dQw4w9WgXcQ" },
            { title: "Module 2: Advanced Biomechanics & Vector Mechanics", id: "3JZ_D3ELwOQ" },
            { title: "Module 3: Quantum States & Wave Equation Calculus", id: "L_LUpnjgPso" },
            { title: "Module 4: Cognitive Logic & Top 1% Problem Solving", id: "aircAruvnKk" }
        ];

        function executeSearch() {
            const val = document.getElementById('topicInput').value.trim();
            if (val) {
                currentTopic = val;
                buildLessonNotes(currentTopic);
                buildVideoLibrary(currentTopic);
                build100QuestionExam(currentTopic);
            }
        }

        function buildLessonNotes(topic) {
            document.getElementById('lessonTitle').innerText = `${topic.toUpperCase()} — COMPREHENSIVE STUDY NOTES`;
            document.getElementById('lessonText').innerHTML = `
                <p><strong>Overview:</strong> Detailed analytical notes covering lower-grade fundamentals through PhD-level research for <em>${topic}</em>.</p>
                <h3>1. Key Theoretical Foundations</h3>
                <p>Understanding ${topic} requires examining structural principles, force vectors, frequency oscillations, and logical axioms. Every system maintains balance through specific conservation laws and kinetic transfers.</p>
                <h3>2. Advanced Formulas & Mechanics</h3>
                <ul>
                    <li><strong>Ground Reaction Force / Energy Transfer:</strong> Kinetic energy scales dynamically ($E_k = \\frac{1}{2}mv^2$).</li>
                    <li><strong>Frequency-Octave Scaling:</strong> Exponential progression ($f_n = f_0 \\cdot 2^{n/12}$).</li>
                    <li><strong>System Optimization:</strong> Minimizing structural drag while maximizing output.</li>
                </ul>
                <h3>3. Practical Application & Mind Strategy</h3>
                <p>Apply these concepts by breaking complex scenarios into isolated variables, checking boundary conditions, and testing edge cases.</p>
            `;
        }

        function buildVideoLibrary(topic) {
            const container = document.getElementById('videoContainer');
            container.innerHTML = '';
            
            // Generate lecture modules
            for (let i = 1; i <= 12; i++) {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <iframe src="https://www.youtube-nocookie.com/embed/3JZ_D3ELwOQ" title="Lecture ${i}"></iframe>
                    <div class="video-title">Lecture ${i}: ${topic} — Advanced Module ${i}</div>
                `;
                container.appendChild(card);
            }
        }

        function build100QuestionExam(topic) {
            document.getElementById('examTopicTag').innerText = `TOPIC: ${topic.toUpperCase()} (100 MCQs)`;
            const container = document.getElementById('examContainer');
            container.innerHTML = '';
            score = 0;
            document.getElementById('scoreVal').innerText = score;

            for (let i = 1; i <= 100; i++) {
                const qCard = document.createElement('div');
                qCard.className = 'q-item';
                
                // Distribute question difficulty (Class 1 to PhD)
                let levelStr = i <= 25 ? "ELEMENTARY (CLASS 1-5)" : i <= 50 ? "HIGH SCHOOL (CLASS 6-12)" : i <= 75 ? "COLLEGE / UNIVERSITY" : "PhD / ADVANCED RESEARCH";
                
                const correctOpt = Math.floor(Math.random() * 4);
                
                qCard.innerHTML = `
                    <div class="q-num">QUESTION ${i} OF 100 • ${levelStr}</div>
                    <div class="q-text">In the context of <strong>${topic}</strong>, what primary principle governs optimal system performance during phase condition #${i}?</div>
                    <div class="opt-list" id="opts-${i}">
                        <button class="opt-btn" onclick="answerQ(${i}, 0, ${correctOpt})">A. Linear conservation of energy and structural equilibrium.</button>
                        <button class="opt-btn" onclick="answerQ(${i}, 1, ${correctOpt})">B. Unregulated dissipation with zero phase coherence.</button>
                        <button class="opt-btn" onclick="answerQ(${i}, 2, ${correctOpt})">C. Random velocity dispersion without vector alignment.</button>
                        <button class="opt-btn" onclick="answerQ(${i}, 3, ${correctOpt})">D. Static resistance without dynamic feedback loops.</button>
                    </div>
                `;
                container.appendChild(qCard);
            }
        }

        function answerQ(qNum, selected, correct) {
            const box = document.getElementById(`opts-${qNum}`);
            const btns = box.querySelectorAll('.opt-btn');
            btns.forEach(b => b.style.pointerEvents = 'none');

            if (selected === correct) {
                btns[selected].classList.add('correct');
                score += 1;
                document.getElementById('scoreVal').innerText = score;
            } else {
                btns[selected].classList.add('wrong');
                btns[correct].classList.add('correct');
            }
        }

        function downloadPDFNotes() {
            window.print();
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));

            if (tab === 'notes') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('notes-view').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('exam-view').classList.add('active');
            }
        }

        // Initialize default view
        buildLessonNotes(currentTopic);
        buildVideoLibrary(currentTopic);
        build100QuestionExam(currentTopic);
    </script>
</body>
</html>
